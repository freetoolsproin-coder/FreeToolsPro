# nginx server block for the retired blog subdomain (blog.freetoolspro.in).
#
# The old blog's ~520 posts were served from the same folder as the old React site. The new
# build has no blog, so every post returned 404. This sends each post to the matching tool or
# category page on https://freetoolspro.in with a 301, so its rankings and links carry over.
#
# Add this as a NEW server block (e.g. /etc/nginx/sites-available/freetoolspro-blog, then
# `sudo ln -s ../sites-available/freetoolspro-blog /etc/nginx/sites-enabled/`), or replace the
# existing blog.freetoolspro.in server block if you have one. Use the same SSL certificate
# lines as the main site if the certificate covers blog.freetoolspro.in (check with
# `sudo certbot certificates`; if not: `sudo certbot --nginx -d blog.freetoolspro.in`).
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name blog.freetoolspro.in;
    return 301 https://blog.freetoolspro.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.freetoolspro.in;

    # <- Same certificate lines as your freetoolspro.in server block, for example:
    ssl_certificate     /etc/letsencrypt/live/freetoolspro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freetoolspro.in/privkey.pem;

    # Keep the old robots.txt reachable so Google can follow the redirects.
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\n"; }

    # One 301 per old post (file written by `npm run build`), plus a fallback for anything else.
    include /var/www/freetoolspro/dist/nginx-blog-redirects.conf;   # <- same ROOT as deploy/nginx.conf
}
