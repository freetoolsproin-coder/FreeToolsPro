# Maintenance mode for freetoolspro.in
#
# Every URL shows maintenance/index.html with HTTP status 503 + Retry-After, which tells Google
# the outage is temporary, so your pages keep their rankings (do not use this for more than a few days).
#
# To switch ON:  upload the maintenance/ folder to the server (e.g. /var/www/freetoolspro/maintenance),
#                put these lines inside your `server { ... }` block INSTEAD of the normal site lines
#                (comment out your current root / location blocks), then:
#                  sudo nginx -t && sudo systemctl reload nginx
# To switch OFF: remove these lines, restore the normal site lines (deploy/nginx.conf), reload nginx.

    root /var/www/freetoolspro/maintenance;     # <- the uploaded maintenance/ folder
    add_header Retry-After 3600 always;         # "try again in about an hour"

    error_page 503 /index.html;
    location = /index.html { internal; }

    # Icons used by the maintenance page itself.
    location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png)$ { try_files $uri =404; }

    location / { return 503; }
