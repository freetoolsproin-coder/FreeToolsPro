name: Uptime check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dotenv
        run: npm install dotenv@^17.4.2 --no-save

      - name: Restore previous uptime state
        uses: actions/cache@v4
        with:
          path: scripts/.uptime-state.json
          key: uptime-state-${{ github.run_id }}
          restore-keys: |
            uptime-state-

      - name: Run uptime check
        env:
          UPTIME_URL: https://freetoolspro.in
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
        run: node scripts/uptime-check.mjs
