<style>
  :root { --ink:#13203b; --ink-2:#4a5672; --paper:#ffffff; --wash:#f3f5f9; --line:#dce2ec; --brand:#D98327; --green:#186049; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e7ebf3; --ink-2:#b3bdd2; --paper:#0e1424; --wash:#151d31; --line:#2a3550; --green:#3fb07f; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--paper); color: var(--ink);
    font: 400 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    background-image: radial-gradient(60% 50% at 50% 0%, color-mix(in oklab, var(--brand) 14%, transparent), transparent 70%); }
  main { width: 100%; max-width: 560px; text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 800; font-size: 1.5rem; letter-spacing: -0.01em; }
  .logo svg { width: 44px; height: 44px; }
  .logo b { color: var(--green); font-weight: 800; } .logo i { color: var(--brand); font-style: normal; }
  .card { margin-top: 28px; padding: 36px 28px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: 0 10px 40px -20px rgba(19,32,59,.35); }
  .gear { width: 64px; height: 64px; margin: 0 auto 14px; color: var(--brand); animation: spin 6s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .gear { animation: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.2; letter-spacing: -0.02em; }
  p { margin: 0 0 12px; color: var(--ink-2); }
  .bar { height: 6px; margin: 22px auto 6px; max-width: 280px; border-radius: 99px; background: var(--wash); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, var(--brand), var(--green)); animation: slide 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 70%; } }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  .small { font-size: .9rem; }
  a { color: var(--brand); }
  footer { margin-top: 22px; font-size: .85rem; color: var(--ink-2); }
