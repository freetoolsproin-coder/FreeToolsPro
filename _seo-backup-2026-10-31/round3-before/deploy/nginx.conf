# Complete nginx site config for freetoolspro.in (Astro static build in dist/).
#
# WHY THIS FILE IS A FULL CONFIG NOW
# Search Console reported "Duplicate, Google chose different canonical than user". On the live
# server (checked 26 Oct 2026) the same page answered on several URLs with 200 OK:
#   https://www.freetoolspro.in/...      whole site duplicated on www, no redirect
#   /calculators/emi-calculator.html     every page duplicated with .html
#   /index.html                          home page duplicated
#   /pdf-tools/merge-pdf (~340 old URLs) 200 + meta refresh instead of a real 301
#   /ebooks                              301 to /ebooks/ which answered 403 Forbidden
#   unknown URLs                         served the HOME PAGE html (canonical "/") with a 404
# Google then picked its own canonical among the copies. This config gives every page exactly
# one URL (https, no www, no .html, no trailing slash) and 301s every other spelling to it.
#
# HOW TO INSTALL (on the server)
#   1. Upload a fresh `npm run build` dist/ to /var/www/freetoolspro/dist (it must contain
#      nginx-redirects.conf; the live server is missing it today).
#   2. Replace the old freetoolspro.in site file with this one, e.g.
#        sudo cp nginx.conf /etc/nginx/sites-available/freetoolspro
#      and remove any other server block that also lists freetoolspro.in or www.freetoolspro.in
#      (check with: grep -rn "freetoolspro" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/).
#   3. If your certificate lives somewhere else, copy your existing ssl_certificate lines over
#      the ones below (find them with: sudo certbot certificates).
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. From your PC: npm run check:live   (tests the live site for duplicate URLs)

# ---------------------------------------------------------------------------------------------
# http://freetoolspro.in and http://www.freetoolspro.in -> https://freetoolspro.in (one hop)
server {
    listen 80;
    listen [::]:80;
    server_name freetoolspro.in www.freetoolspro.in;

    # Let's Encrypt renewals keep working.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://freetoolspro.in$request_uri; }
}

# ---------------------------------------------------------------------------------------------
# https://www.freetoolspro.in -> https://freetoolspro.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.freetoolspro.in;

    ssl_certificate     /etc/letsencrypt/live/freetoolspro.in/fullchain.pem;   # <- your cert
    ssl_certificate_key /etc/letsencrypt/live/freetoolspro.in/privkey.pem;     # <- your key
    include /etc/letsencrypt/options-ssl-nginx.conf;   # delete this line if the file doesn't exist

    return 301 https://freetoolspro.in$request_uri;
}

# ---------------------------------------------------------------------------------------------
# The site: https://freetoolspro.in
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name freetoolspro.in;

    ssl_certificate     /etc/letsencrypt/live/freetoolspro.in/fullchain.pem;   # <- your cert
    ssl_certificate_key /etc/letsencrypt/live/freetoolspro.in/privkey.pem;     # <- your key
    include /etc/letsencrypt/options-ssl-nginx.conf;   # delete this line if the file doesn't exist

    root /var/www/freetoolspro/dist;                   # <- ROOT: the deployed dist/ folder

    # 301s for the ~340 retired URLs and 410 for the deleted blog (written by `npm run build`).
    include /var/www/freetoolspro/dist/nginx-redirects.conf;   # <- same ROOT + /nginx-redirects.conf

    # One URL per page: /page/ -> /page (query string is kept).
    rewrite ^/(.+)/$ /$1 permanent;

    # Home page lives at "/" only.
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }

    # Pages are built as /x/y.html but linked without .html: send the .html spelling to the clean URL.
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }

    # Clean URL -> the built file. A folder (like /ebooks/ holding the PDFs) never wins over the page.
    location / {
        try_files $uri $uri.html =404;
    }

    # Real 404 page with a real 404 status (never the home page).
    error_page 404 /404.html;
    error_page 410 /404.html;   # the deleted blog answers 410 Gone and shows the 404 page
    location = /404.html { internal; }
    location = /404 { return 404; }

    # Hashed CSS/JS never change: cache for a year.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Redirect files for other hosts and dotfiles are not public pages.
    location ~ ^/(_redirects|vercel\.json|redirects\.json|nginx-redirects\.conf|nginx-blog-redirects\.conf)$ { return 404; }
    location ~ /\. { return 404; }

    # Compression for text files (skip if already set in /etc/nginx/nginx.conf).
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml text/plain image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
